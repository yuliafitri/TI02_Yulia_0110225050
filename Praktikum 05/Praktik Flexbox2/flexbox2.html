<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Layout</title>
    <link rel="stylesheet" href="flexbox2.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="assets/img/box1.png" alt="Header Image">
        </div>
        <div class="content">
            <div class="sidebar-left">
                <div class="box box1">
                    <img src="assets/img/box7.jpg" alt="Box 1">
                </div>
                <div class="box box2">
                    <img src="assets/img/box4.jpg" alt="Box 2">
                </div>
            </div>
            <div class="main-content">
                <div class="box box3">
                    <img src="assets/img/box5.jpeg" alt="Box 3">
                </div>
                <div class="box box4">
                    <img src="assets/img/box6.avif" alt="Box 4">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
