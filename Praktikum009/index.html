<!DOCTYPE html>
<html>
<head>
    <title>Image Picker</title>
    <style>
        body {
            font-family: Arial;
            margin: 50px;
            background-color: #f0f0f0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            font-size: 18px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        .gambar {
            text-align: center;
            padding: 20px;
            background-color: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 5px;
            min-height: 300px;
        }

        .gambar img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 5px;
        }

        .kotak-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .kotak-alert h3 {
            margin-top: 0;
            color: #333;
        }

        .tombol-ok {
            background-color: #4CAF50;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .tombol-ok:hover {
            background-color: #45a049;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Image Picker</h1>
        
        <label>Pilih Gambar:</label>
        <select id="pilihanGambar">
            <option value="">-- Pilih Gambar --</option>
            <option value="bison">bison</option>
            <option value="gorila">gorila</option>
            <option value="gajah">gajah</option>
            <option value="harimau">harimau</option>
            <option value="kucing">kucing</option>
        </select>

        <div class="gambar" id="tempatGambar">
            <p>Pilih gambar dari dropdown</p>
        </div>
    </div>

    <!-- Overlay gelap -->
    <div class="overlay" id="overlay"></div>

    <!-- Kotak Alert -->
    <div class="kotak-alert" id="kotakAlert">
        <h3>⚠️ Aplikasi Javascript</h3>
        <p id="pesanAlert">Ini gambar bison.jpg</p>
        <button class="tombol-ok" onclick="tutupAlert()">OK</button>
    </div>

    <!-- Panggil file JavaScript terpisah -->
    <script src="script.js"></script>

</body>
</html>
